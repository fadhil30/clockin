version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: clockin_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: clockin_db
    ports:
      - '3308:3306'
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
